<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="bootstrap.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li>Home</li>
            <li>Products</li>
            <li>Orders</li>
            <li>Users</li>
            <li>Settings</li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Welcome User</h1>

        <div class="cards">
            <div class="card">
                <h3>Products</h3>
                <p>120</p>
            </div>
            <div class="card">
                <h3>Orders</h3>
                <p>80</p>
            </div>
            <div class="card">
                <h3>Users</h3>
                <p>150</p>
            </div>
            <div class="card">
                <h3>Revenue</h3>
                <p>$5000</p>
            </div>
        </div>
    </div>

</body>
</html>
